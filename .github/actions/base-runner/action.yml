name: base runner

description: install the fixed ubuntu ci toolchain

runs:
  using: composite
  steps:
    - name: install ci toolchain
      shell: bash
      run: |
        set -euo pipefail
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          ca-certificates \
          bash \
          git \
          curl \
          cmake \
          ninja-build \
          g++-13 \
          gcc-13 \
          clang-18 \
          llvm-18 \
          clang-format \
          clang-tidy \
          ccache \
          cppcheck \
          python3 \
          shellcheck \
          just \
          coreutils \
          pipewire \
          alsa-utils \
          wl-clipboard \
          xclip \
          libnotify-bin
        sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-13 130
        sudo update-alternatives --install /usr/bin/g++ g++ /usr/bin/g++-13 130
        sudo update-alternatives --install /usr/bin/cc cc /usr/bin/gcc-13 130
        sudo update-alternatives --install /usr/bin/c++ c++ /usr/bin/g++-13 130
        sudo rm -rf /var/lib/apt/lists/*
