name: CI

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: CI-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    permissions:
      contents: read
      pull-requests: read
    uses: ./.github/workflows/on-workflow-call-check-changes.yml

  shellcheck:
    needs: changes
    if: needs.changes.outputs.non_docs == 'true'
    uses: ./.github/workflows/on-workflow-call-shell-check.yml

  format:
    needs: changes
    if: needs.changes.outputs.non_docs == 'true'
    uses: ./.github/workflows/on-workflow-call-format.yml

  build:
    needs:
      - shellcheck
      - format
    uses: ./.github/workflows/on-workflow-call-build.yml

  build-vulkan:
    needs:
      - shellcheck
      - format
    uses: ./.github/workflows/on-workflow-call-build-vulkan.yml

  build-cuda:
    needs:
      - shellcheck
      - format
    uses: ./.github/workflows/on-workflow-call-build-cuda.yml

  lint:
    needs: build
    uses: ./.github/workflows/on-workflow-call-lint.yml

  test:
    needs: build
    uses: ./.github/workflows/on-workflow-call-test.yml

  sanitizers:
    needs: build
    uses: ./.github/workflows/on-workflow-call-sanitizers.yml

  install-uninstall:
    needs:
      - test
      - sanitizers
    uses: ./.github/workflows/on-workflow-call-distros.yml
