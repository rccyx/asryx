name: build cuda

on:
  workflow_call:

permissions:
  contents: read

jobs:
  run:
    name: build cuda
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    env:
      CUDACXX: /usr/local/cuda-12.8/bin/nvcc
      CUDAToolkit_ROOT: /usr/local/cuda-12.8
      CUDAARCHS: "75"
      CCACHE_DIR: /home/runner/.cache/ccache
      CCACHE_COMPRESS: "true"
      CCACHE_MAXSIZE: 1G

    steps:
      - name: checkout
        uses: actions/checkout@v7

      - name: base runner
        uses: ./.github/actions/base-runner

      - name: install cuda build dependencies
        shell: bash
        run: |
          set -euo pipefail

          keyring="${RUNNER_TEMP}/cuda-keyring.deb"

          curl -fsSL \
            "https://developer.download.nvidia.com/compute/cuda/repos/ubuntu2404/x86_64/cuda-keyring_1.1-1_all.deb" \
            -o "${keyring}"

          sudo dpkg -i "${keyring}"
          sudo apt-get update

          sudo apt-get install -y --no-install-recommends \
            cuda-compiler-12-8 \
            cuda-libraries-dev-12-8

          sudo rm -rf /var/lib/apt/lists/*

          echo "/usr/local/cuda-12.8/bin" >>"${GITHUB_PATH}"

      - name: verify cuda compiler
        shell: bash
        run: |
          set -euo pipefail

          test -x "${CUDACXX}"
          "${CUDACXX}" --version

      - name: project install
        uses: ./.github/actions/project-install
        with:
          backend: cuda

      - name: verify cuda build
        shell: bash
        run: |
          set -euo pipefail

          cache="${GITHUB_WORKSPACE}/build/release-cuda/CMakeCache.txt"
          binary="${GITHUB_WORKSPACE}/build/release-cuda/asryx"

          test -f "${cache}"
          test -x "${binary}"

          grep -Eq '^CMAKE_CXX_STANDARD:[^=]+=23$' "${cache}"
          grep -Eq '^BACKEND:STRING=cuda$' "${cache}"
          grep -Eq '^GGML_CUDA:BOOL=ON$' "${cache}"
          grep -Eq '^GGML_VULKAN:BOOL=OFF$' "${cache}"
          grep -Eq '^CMAKE_CUDA_COMPILER:FILEPATH=.*/nvcc$' "${cache}"
          grep -Eq '^CMAKE_CUDA_ARCHITECTURES:[^=]+=75$' "${cache}"
