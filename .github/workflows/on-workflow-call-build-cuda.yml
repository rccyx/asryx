name: build cuda

on:
  workflow_call:

permissions:
  contents: read

jobs:
  run:
    name: build cuda
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    env:
      CUDACXX: /usr/local/cuda-12.8/bin/nvcc
      CUDAToolkit_ROOT: /usr/local/cuda-12.8
      CCACHE_DIR: /home/runner/.cache/ccache
      CCACHE_COMPRESS: "true"
      CCACHE_MAXSIZE: 1G

    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: base runner
        uses: ./.github/actions/base-runner

      - name: install cuda build dependencies
        shell: bash
        run: |
          set -euo pipefail

          keyring="${RUNNER_TEMP}/cuda-keyring.deb"

          curl -fsSL \
            "https://developer.download.nvidia.com/compute/cuda/repos/ubuntu2404/x86_64/cuda-keyring_1.1-1_all.deb" \
            -o "${keyring}"

          sudo dpkg -i "${keyring}"
          sudo apt-get update

          sudo apt-get install -y --no-install-recommends \
            cuda-compiler-12-8 \
            cuda-libraries-dev-12-8

          sudo rm -rf /var/lib/apt/lists/*

          echo "/usr/local/cuda-12.8/bin" >>"${GITHUB_PATH}"

      - name: verify cuda compiler
        shell: bash
        run: |
          set -euo pipefail

          test -x "${CUDACXX}"
          "${CUDACXX}" --version

      - name: cache cuda build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.local/opt/whisper.cpp
            ~/.cache/ccache
          key: ${{ runner.os }}-${{ runner.arch }}-cuda-${{ hashFiles('CMakeLists.txt', 'CMakePresets.json', 'versions/whisper-cpp-sha') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-cuda-${{ hashFiles('CMakeLists.txt', 'CMakePresets.json', 'versions/whisper-cpp-sha') }}-
            ${{ runner.os }}-${{ runner.arch }}-cuda-

      - name: prepare whisper.cpp
        shell: bash
        run: |
          set -euo pipefail

          whisper_dir="${HOME}/.local/opt/whisper.cpp"
          whisper_sha="$(tr -d '[:space:]' <versions/whisper-cpp-sha)"

          mkdir -p "$(dirname "${whisper_dir}")"

          if [[ ! -d "${whisper_dir}/.git" ]]; then
            rm -rf -- "${whisper_dir}"
            git init "${whisper_dir}"
            git -C "${whisper_dir}" remote add origin \
              https://github.com/ggerganov/whisper.cpp.git
          fi

          git -C "${whisper_dir}" remote set-url origin \
            https://github.com/ggerganov/whisper.cpp.git

          git -C "${whisper_dir}" fetch \
            --depth 1 \
            origin \
            "${whisper_sha}"

          git -C "${whisper_dir}" checkout \
            --detach \
            FETCH_HEAD

          git -C "${whisper_dir}" submodule sync \
            --recursive

          git -C "${whisper_dir}" submodule update \
            --init \
            --recursive \
            --depth 1

      - name: configure cuda
        shell: bash
        run: |
          set -euo pipefail

          cmake \
            --fresh \
            --preset release-cuda \
            -S "${GITHUB_WORKSPACE}" \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CUDA_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CUDA_ARCHITECTURES=75

      - name: build cuda
        shell: bash
        run: |
          set -euo pipefail

          cmake \
            --build \
            --preset release-cuda \
            --target asryx \
            --parallel "$(nproc)"

      - name: verify cuda build
        shell: bash
        run: |
          set -euo pipefail

          cache="${GITHUB_WORKSPACE}/build/release-cuda/CMakeCache.txt"
          binary="${GITHUB_WORKSPACE}/build/release-cuda/asryx"

          test -f "${cache}"
          test -x "${binary}"

          grep -Eq '^ASRYX_BACKEND:STRING=cuda$' "${cache}"
          grep -Eq '^GGML_CUDA:BOOL=ON$' "${cache}"
          grep -Eq '^GGML_VULKAN:BOOL=OFF$' "${cache}"
          grep -Eq '^CMAKE_CUDA_COMPILER:FILEPATH=.*/nvcc$' "${cache}"
          grep -Eq '^CMAKE_CUDA_ARCHITECTURES:[^=]+=75$' "${cache}"
