name: build vulkan

on:
  workflow_call:

permissions:
  contents: read

jobs:
  run:
    name: build vulkan / ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            machine: x86_64
            runner: ubuntu-24.04
          - arch: arm64
            machine: aarch64
            runner: ubuntu-24.04-arm

    env:
      CCACHE_DIR: /home/runner/.cache/ccache
      CCACHE_COMPRESS: "true"
      CCACHE_MAXSIZE: 1G

    steps:
      - name: checkout
        uses: actions/checkout@v7

      - name: base runner
        uses: ./.github/actions/base-runner

      - name: install vulkan build dependencies
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libvulkan-dev \
            glslc \
            spirv-headers

          sudo rm -rf /var/lib/apt/lists/*

      - name: project install
        uses: ./.github/actions/project-install

      - name: configure vulkan
        shell: bash
        run: |
          set -euo pipefail

          cmake \
            --fresh \
            --preset release-vulkan \
            -S "${GITHUB_WORKSPACE}" \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: build vulkan
        shell: bash
        run: |
          set -euo pipefail

          cmake \
            --build \
            --preset release-vulkan \
            --target asryx \
            --parallel "$(nproc)"

      - name: verify vulkan build
        shell: bash
        run: |
          set -euo pipefail

          cache="${GITHUB_WORKSPACE}/build/release-vulkan/CMakeCache.txt"
          binary="${GITHUB_WORKSPACE}/build/release-vulkan/asryx"

          test -f "${cache}"
          test -x "${binary}"

          grep -Eq '^CMAKE_CXX_STANDARD:[^=]+=23$' "${cache}"
          grep -Eq '^BACKEND:STRING=vulkan$' "${cache}"
          grep -Eq '^GGML_VULKAN:BOOL=ON$' "${cache}"
          grep -Eq '^GGML_CUDA:BOOL=OFF$' "${cache}"
