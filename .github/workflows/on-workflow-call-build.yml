name: build

on:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            machine: x86_64
            runner: ubuntu-24.04
          - arch: arm64
            machine: aarch64
            runner: ubuntu-24.04-arm

    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: verify architecture
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = "${{ matrix.machine }}"

      - name: base runner
        uses: ./.github/actions/base-runner

      - name: project install
        uses: ./.github/actions/project-install

      - name: build
        run: just b
