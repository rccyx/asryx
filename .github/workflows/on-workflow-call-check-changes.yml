name: changes

on:
  workflow_call:
    outputs:
      non_docs:
        description: "true if any non documentation files changed"
        value: ${{ jobs.detect.outputs.non_docs }}

permissions:
  contents: read
  pull-requests: read

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      non_docs: ${{ steps.filter.outputs.non_docs }}
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: detect non-docs changes
        id: filter
        uses: dorny/paths-filter@v4
        with:
          base: ${{ github.ref }}
          predicate-quantifier: every
          filters: |
            non_docs:
              - '**'
              - '!README.md'
              - '!docs/**'
              - '!assets/**'
              - '!**/*.md'
              - '!**/*.mdx'
