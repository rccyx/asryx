on:
  workflow_call:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - distro: debian-trixie
            image: debian:trixie
            toolchain: clang-19
          - distro: debian-trixie
            image: debian:trixie
            toolchain: gcc-14
          - distro: ubuntu-24.04
            image: ubuntu:24.04
            toolchain: distro-default
          - distro: fedora-latest
            image: fedora:latest
            toolchain: distro-default
          - distro: arch-latest
            image: archlinux:latest
            toolchain: distro-default

    name: smoke / ${{ matrix.distro }} / ${{ matrix.toolchain }}
    container:
      image: ${{ matrix.image }}

    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: install dependencies
        shell: bash
        run: |
          set -euo pipefail

          if command -v apt-get >/dev/null 2>&1; then
            export DEBIAN_FRONTEND=noninteractive
            apt-get update
            compiler_packages=(g++)
            if [[ "${{ matrix.toolchain }}" == "clang-19" ]]; then
              compiler_packages=(clang)
            fi
            apt-get install -y --no-install-recommends \
              sudo \
              ca-certificates \
              bash \
              git \
              curl \
              cmake \
              ninja-build \
              "${compiler_packages[@]}" \
              coreutils \
              pipewire \
              alsa-utils \
              wl-clipboard \
              xclip \
              libnotify-bin
            rm -rf /var/lib/apt/lists/*
          elif command -v dnf >/dev/null 2>&1; then
            dnf -y install \
              sudo \
              ca-certificates \
              bash \
              git \
              curl \
              cmake \
              ninja-build \
              gcc-c++ \
              coreutils \
              pipewire-utils \
              alsa-utils \
              wl-clipboard \
              xclip \
              libnotify
          elif command -v pacman >/dev/null 2>&1; then
            pacman -Sy --noconfirm
            pacman -S --noconfirm --needed \
              sudo \
              ca-certificates \
              bash \
              git \
              curl \
              cmake \
              ninja \
              gcc \
              coreutils \
              pipewire \
              alsa-utils \
              wl-clipboard \
              xclip \
              libnotify
          else
            echo "no supported package manager found" >&2
            exit 1
          fi

      - name: toolchain summary
        shell: bash
        run: |
          set -euo pipefail

          if command -v clang >/dev/null 2>&1 && command -v clang++ >/dev/null 2>&1; then
            cc=clang
            cxx=clang++
          elif command -v gcc >/dev/null 2>&1 && command -v g++ >/dev/null 2>&1; then
            cc=gcc
            cxx=g++
          else
            echo "missing compiler pair" >&2
            exit 1
          fi

          cmake --version | sed -n '1p'
          "${cc}" --version | sed -n '1p'
          "${cxx}" --version | sed -n '1p'

      - name: ci user
        shell: bash
        run: |
          set -euo pipefail
          useradd -m -s /bin/bash ci || true
          echo 'ci ALL=(ALL) NOPASSWD:ALL' >/etc/sudoers.d/ci
          chmod 0440 /etc/sudoers.d/ci
          chown -R ci:ci "${GITHUB_WORKSPACE}"

      - name: install
        shell: bash
        run: |
          set -euo pipefail
          sudo -u ci -H bash -lc "cd '${GITHUB_WORKSPACE}' && bash ./package/install"

      - name: verify install
        shell: bash
        run: |
          set -euo pipefail
          ci_home=$(getent passwd ci | cut -d: -f6)
          asryx_bin="${ci_home}/.local/bin/asryx"

          test -x "${asryx_bin}"
          "${asryx_bin}" status | grep -qx 'idle'
          "${asryx_bin}" --model list >/dev/null

      - name: uninstall
        shell: bash
        run: |
          set -euo pipefail
          sudo -u ci -H bash -lc "cd '${GITHUB_WORKSPACE}' && bash ./package/uninstall"

      - name: verify uninstall
        shell: bash
        run: |
          set -euo pipefail
          ci_home=$(getent passwd ci | cut -d: -f6)
          test ! -e "${ci_home}/.local/bin/asryx"
